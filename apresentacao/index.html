<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tela de apresenta&ccedil;&atilde;o do sistema de sorteio Mentes do Una Podcast.">
    <title>Tela de Apresenta&ccedil;&atilde;o | Mentes do Una Podcast</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260604-firebase">
  </head>
  <body data-screen="presentation">
    <main class="presentation-app">
      <header class="presentation-header">
        <div class="header-brand">
          <div class="brand-logo brand-logo-large" data-logo-slot aria-label="Logo do evento">
            <span>LOGO</span>
          </div>
          <div class="title-block">
            <span class="eyebrow">Tela de Apresenta&ccedil;&atilde;o</span>
            <h1 id="presentationEventName">Mentes do Una Podcast</h1>
          </div>
        </div>

        <div class="presentation-meta">
          <span id="presentationRange">Faixa 1-1000</span>
          <time id="presentationClock" datetime="">--:--:--</time>
          <button class="icon-button fullscreen-button" id="fullscreenButton" type="button" aria-label="Tela cheia">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="presentation-layout">
        <div class="draw-stage" aria-live="polite" aria-atomic="true">
          <span class="stage-label" id="presentationStageLabel">Aguardando sorteio</span>
          <strong class="draw-number-display" id="presentationNumber">--</strong>
          <time class="draw-date" id="presentationDrawTime" datetime="">Sem sorteio registrado</time>
          <div class="spin-track" aria-hidden="true">
            <span></span>
          </div>
        </div>

        <aside class="presentation-history-panel" aria-labelledby="presentationHistoryTitle">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Hist&oacute;rico</span>
              <h2 id="presentationHistoryTitle">N&uacute;meros sorteados</h2>
            </div>
            <span class="count-badge" id="presentationHistoryCount">0</span>
          </div>
          <ol class="history-list presentation-history-list" id="presentationHistoryList"></ol>
        </aside>
      </section>

      <footer class="presentation-footer">
        <span id="presentationSync">Atualiza&ccedil;&atilde;o autom&aacute;tica ativa</span>
        <span id="presentationRemaining">1000 n&uacute;meros restantes</span>
      </footer>
    </main>

    <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-database-compat.js"></script>
    <script src="/assets/app.js?v=20260604-firebase"></script>
  </body>
</html>
